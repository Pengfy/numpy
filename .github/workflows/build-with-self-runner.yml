name: Build and Publish With Self-hosted Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check Python version
        run: |
          python3.14 --version
          python3.14 -m pip --version

      - name: Install build tools
        run: |
          python3.14 -m pip install --upgrade pip --break-system-packages
          python3.14 -m pip install build twine --break-system-packages

      - name: Build package
        run: python3.14 -m build

      - name: Check package
        run: python3.14 -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3.14 -m twine upload dist/*
